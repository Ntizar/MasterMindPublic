name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run test-doctor
      run: |
        python scripts/test-doctor.py --json
      continue-on-error: false

    - name: Run doctor
      env:
        MM_DOCTOR_SANDBOX: "1"
      run: |
        python scripts/doctor.py --json

    - name: Run demo (no API key needed)
      run: |
        python scripts/demo.py --json

    - name: Run router (demo mode)
      run: |
        python scripts/router-jev.py "crear un skill" --json

    - name: Run skill-lifecycle (demo)
      run: |
        python scripts/skill-lifecycle.py